<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0b3d91" />
<meta name="description" content="Boatrace Open API を使ったボートレース予想アプリ。出走表データから自動で本命・対抗を予想します。" />
<title>🚤 ボートレース予想</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚤</text></svg>" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="app-header">
  <h1>🚤 ボートレース予想</h1>
  <p class="subtitle">Boatrace Open API 自動予想</p>
</header>

<main id="app">
  <section class="controls">
    <div class="control-row">
      <label for="venue">会場</label>
      <select id="venue" disabled><option>読み込み中…</option></select>
    </div>
    <div class="control-row">
      <label for="race">レース</label>
      <select id="race" disabled><option>—</option></select>
    </div>
    <div class="btn-row">
      <button id="predict" class="predict-btn" disabled>予想する</button>
      <button id="refresh" class="refresh-btn" title="出走表・直前情報を再取得">🔄</button>
    </div>
    <label class="claude-toggle"><input type="checkbox" id="useClaude" /> 🤖 Claude(AI)に予想させる<span class="claude-note">※直前情報サーバー必須・1回ごとに少額課金</span></label>
    <details class="settings">
      <summary>⚙️ 直前情報サーバー設定（任意）</summary>
      <input id="proxyUrl" type="url" inputmode="url" autocapitalize="off" autocomplete="off"
             placeholder="https://script.google.com/macros/s/.../exec" />
      <p class="hint">Google Apps Script の公開URL（/exec）を貼り付けると、締切前の<b>展示タイム等を公式から自動取得</b>します（保存されます）。未設定でも出走表ベースの予想は使えます。設定方法は worker/GAS-README.md を参照。</p>
    </details>
  </section>

  <div id="status" class="status"></div>
  <section id="result" class="result" hidden></section>
</main>

<footer class="app-footer">
  <p>データ提供: <a href="https://boatraceopenapi.github.io/" target="_blank" rel="noopener">Boatrace Open API</a></p>
  <p class="disclaimer">※ 本アプリの予想は公開データに基づく自動計算であり、的中を保証するものではありません。舟券の購入は自己責任で。20歳未満は舟券を購入できません。</p>
  <p class="version" id="version"></p>
</footer>

<script src="app.js"></script>
</body>
</html>
